; Logging for the BBS dial-in host.
;
; The service runs under systemd, so the console channel is what lands in the
; journal. A messages file is kept as well because modem handshake diagnosis
; benefits from being able to scroll back further than the journal retention.

[general]
dateformat = %F %T

[logfiles]
console => notice,warning,error
; verbose: the softmodem's status lines (V.42 active, link released, ...)
messages => notice,warning,error,verbose

; For a modem handshake trace (V.22bis training, every V.42 frame), add a
; debug channel at runtime and enable the module's debug output:
;   asterisk -rx "logger add channel softmodem-debug debug"
;   asterisk -rx "core set debug 1 app_softmodem.so"
; Both last until the next Asterisk restart.
