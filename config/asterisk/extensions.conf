; Dialplan for the BBS dial-in host.
;
; One context per terminal mode. A call arriving on a line is answered and
; handed straight to the software modem, which demodulates it and opens a TCP
; connection to the matching relay. The relay speaks RLogin to Synchronet.
;
; Softmodem() option syntax is taken from the module's own XML documentation,
; not from third-party write-ups: the default modem version is V23 (1200/75),
; which is not what either line wants, and the default bit order changed from
; MSB to LSB in this version. Both are therefore stated explicitly.
;
;   v(...)  modem version   d(8)  data bits
;   l       LSB first       s(1)  stop bits
;   c       V.42 error correction (needs the patched module, see INSTALL.md)
;   b       V.42bis compression on top of V.42
;   t(-16)  transmit level in dBm0

[globals]
RELAY_HOST = 127.0.0.1
RELAY_ANSI = 2301
RELAY_PETSCII = 2341
; Generous ceiling: a long read on a slow line is normal, a call still up after
; two hours is not.
CALL_TIMEOUT = 7200

[line-ansi]
; Lines 401-403. V.22bis, 2400 bps, 80-column ANSI/CP437.
exten => _.,1,NoOp(BBS dial-in on ANSI line ${EXTEN} from ${CALLERID(num)})
 same => n,Answer()
; A real modem waits a moment before its answer tone; this also lets the RTP
; path settle before the handshake starts. Tunable if callers time out.
 same => n,Wait(1)
 same => n,Set(TIMEOUT(absolute)=${CALL_TIMEOUT})
; t(-16): TX level -16 dBm. The default -28 dBm was too weak for some
; softmodem receivers behind an ATA (a HaM PCI modem failed most calls).
 same => n,Softmodem(${RELAY_HOST},${RELAY_ANSI},v(V22bis)ld(8)s(1)cbt(-16))
 same => n,Hangup()

[line-petscii]
; Line 404. V.22, 1200 bps, 40-column PETSCII for the Commodore 64.
; If the C64's modem turns out to be Bell 212A rather than V.22, this becomes
; v(Bell103) at 300 bps -- that is a modulation mismatch, not a line fault.
exten => _.,1,NoOp(BBS dial-in on PETSCII line ${EXTEN} from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(TIMEOUT(absolute)=${CALL_TIMEOUT})
 same => n,Softmodem(${RELAY_HOST},${RELAY_PETSCII},v(V22)ld(8)s(1)t(-16))
 same => n,Hangup()
