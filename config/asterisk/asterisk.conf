; Minimal asterisk.conf for the BBS dial-in host.
;
; Asterisk was built with --prefix=/usr/local, so its compiled-in directory
; defaults are already correct and are not repeated here. Only the things that
; must differ from the defaults are set.

[options]
; Never run as root. The service binds 5060 and the RTP range, both above 1024,
; so no privileges are needed.
runuser = asterisk
rungroup = asterisk

; This is a dedicated appliance, not a shared PBX -- fail loudly rather than
; limping along with a half-loaded configuration.
verbose = 3
