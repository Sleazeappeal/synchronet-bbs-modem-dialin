; Module loading for the BBS dial-in host.
;
; autoload is left on for now. The dependency set installed on this host is
; already small, so relatively little gets built in the first place, and
; trimming to an explicit load list before the SIP registration and a first
; call are proven would turn every missing-module mistake into a confusing
; registration failure. Make it work, then make it minimal.
;
; The noload list below covers modules that are actively unwanted rather than
; merely unused.

[modules]
autoload = yes

; No PBX features are wanted on a dial-in appliance.
noload => app_voicemail.so
noload => app_meetme.so
noload => app_confbridge.so
noload => app_chanspy.so
noload => app_originate.so

; This Asterisk never acts as a registrar or a B2BUA for anyone else.
noload => res_pjsip_registrar.so
noload => res_pjsip_publish_asterisk.so

; Remote control interfaces are not used and should not be listening.
; manager.so is NOT listed here: in Asterisk 22 it is a built-in module and
; "noload" on it is a fatal startup error. AMI is off anyway -- it only listens
; when manager.conf enables it, and there is no manager.conf on this host.
noload => res_agi.so
