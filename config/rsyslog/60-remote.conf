# Optional: forward all logs of the BBS host to a central log server.
#
# Install as /etc/rsyslog.d/60-remote.conf and replace LOGHOST with the
# collector's address. Use a literal IPv4 address if the name also has a
# link-local IPv6 record: a link-local address without a zone identifier is
# not a usable syslog destination.
#
# "@" is UDP, the classic transport for port 514. Change to "@@" for TCP if the
# collector listens that way -- UDP will silently discard everything if it does
# not, which is exactly the failure mode worth knowing about.

*.* @LOGHOST:514

# What reaches this rule:
#   - Synchronet, which logs through syslog() directly because the unit runs
#     "sbbs d" (daemon mode)
#   - everything journald captures -- Asterisk's console output, the relay
#     services, the backup job, systemd itself -- with ForwardToSyslog=yes in
#     /etc/systemd/journald.conf.d/forward-to-syslog.conf
